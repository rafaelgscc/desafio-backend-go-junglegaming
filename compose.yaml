services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle_wallet
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
