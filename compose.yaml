services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle_wallet
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://jungle:jungle@postgres:5432/jungle_wallet?sslmode=disable
    command:
      - up

volumes:
  postgres_data:
